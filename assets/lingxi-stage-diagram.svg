<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Lingxi state ladder</title>
  <desc id="desc">A bilingual schematic showing Lingxi progressing from normal to small broken, large broken, and depleted states as quota decreases.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.52" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#f7f1ff"/>
    </linearGradient>
    <linearGradient id="normalDress" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfeaff"/>
    </linearGradient>
    <linearGradient id="wornDress" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f5f2fb"/>
      <stop offset="1" stop-color="#cfd8ec"/>
    </linearGradient>
    <linearGradient id="brokenDress" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e8e3ef"/>
      <stop offset="1" stop-color="#b7c2d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#567" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 700 30px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #26324a; }
      .subtitle { font: 500 15px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #62708a; }
      .card-title { font: 700 22px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #24304a; }
      .card-cn { font: 700 19px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #5e4b8b; }
      .note { font: 500 14px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #66748d; }
      .tiny { font: 600 12px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #77849a; }
      .card { fill: rgba(255,255,255,0.88); stroke: #d8e3f5; stroke-width: 1.4; }
      .arrow { stroke: #8da8d8; stroke-width: 3; stroke-linecap: round; fill: none; }
      .hair { fill: #fbfdff; stroke: #c9d8f3; stroke-width: 2; }
      .skin { fill: #fff0f5; stroke: #d8b8c8; stroke-width: 1.6; }
      .eye { fill: #7354b8; }
      .pendant { fill: #3fd2e6; stroke: #15899a; stroke-width: 1.2; }
      .damage { stroke: #7a6f85; stroke-width: 2; stroke-linecap: round; fill: none; }
      .ice { stroke: #70cbe4; stroke-width: 1.2; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>
  <text x="60" y="58" class="title">Lingxi State Ladder / 灵汐阶段图</text>
  <text x="60" y="86" class="subtitle">Same identity anchors, changing energy and damage state as quota falls.</text>

  <g transform="translate(50 120)" filter="url(#shadow)">
    <rect class="card" width="240" height="330" rx="18"/>
    <text x="28" y="42" class="card-title">Normal</text>
    <text x="28" y="70" class="card-cn">标准</text>
    <text x="28" y="300" class="note">100%-60% quota</text>
    <text x="28" y="320" class="tiny">Clean outfit · calm motion</text>
    <g transform="translate(120 170)">
      <path d="M-38 -75 L-66 -100 L-54 -58" class="hair"/>
      <path d="M38 -75 L66 -100 L54 -58" class="hair"/>
      <path d="M-54 -58 C-58 -25 -42 12 -24 28 L24 28 C42 12 58 -25 54 -58 C43 -96 -42 -96 -54 -58Z" class="hair"/>
      <circle class="skin" cx="0" cy="-48" r="42"/>
      <circle class="eye" cx="-14" cy="-50" r="4.8"/>
      <circle class="eye" cx="14" cy="-50" r="4.8"/>
      <path d="M-8 -34 Q0 -29 8 -34" stroke="#8b627a" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M-34 6 C-18 -8 18 -8 34 6 L48 76 C20 92 -20 92 -48 76Z" fill="url(#normalDress)" stroke="#9fb3da" stroke-width="2"/>
      <circle class="pendant" cx="0" cy="22" r="7"/>
      <path d="M-42 8 C-72 26 -72 52 -44 62" stroke="#9fb3da" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M42 8 C72 26 72 52 44 62" stroke="#9fb3da" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path class="ice" d="M0 -124 V-112 M-7 -118 H7 M-5 -123 L5 -113 M5 -123 L-5 -113"/>
    </g>
  </g>

  <path class="arrow" d="M305 285 H330"/>
  <path d="M330 285 l-10 -7 v14Z" fill="#8da8d8"/>

  <g transform="translate(340 120)" filter="url(#shadow)">
    <rect class="card" width="240" height="330" rx="18"/>
    <text x="28" y="42" class="card-title">Small Broken</text>
    <text x="28" y="70" class="card-cn">小破</text>
    <text x="28" y="300" class="note">&lt;60% quota</text>
    <text x="28" y="320" class="tiny">Slight fatigue · worn edges</text>
    <g transform="translate(120 174) rotate(-2)">
      <path d="M-38 -75 L-66 -100 L-54 -58" class="hair"/>
      <path d="M38 -75 L66 -100 L54 -58" class="hair"/>
      <path d="M-54 -58 C-58 -25 -42 12 -24 28 L24 28 C42 12 58 -25 54 -58 C43 -96 -42 -96 -54 -58Z" class="hair"/>
      <circle class="skin" cx="0" cy="-48" r="42"/>
      <path d="M-20 -51 Q-14 -48 -8 -51" stroke="#7354b8" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle class="eye" cx="14" cy="-50" r="4.4"/>
      <path d="M-8 -32 Q0 -36 8 -32" stroke="#8b627a" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M-34 6 C-18 -8 18 -8 34 6 L48 76 C18 88 -22 92 -48 76Z" fill="url(#wornDress)" stroke="#9aa9c8" stroke-width="2"/>
      <path class="damage" d="M-33 52 l12 8 l-9 10 M28 42 l-10 7 l13 9"/>
      <circle class="pendant" cx="0" cy="22" r="6"/>
      <path d="M-42 8 C-66 30 -64 53 -42 60" stroke="#9aa9c8" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M42 8 C62 28 62 48 45 58" stroke="#9aa9c8" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path class="ice" d="M-52 -122 V-112 M-58 -117 H-46"/>
    </g>
  </g>

  <path class="arrow" d="M595 285 H620"/>
  <path d="M620 285 l-10 -7 v14Z" fill="#8da8d8"/>

  <g transform="translate(630 120)" filter="url(#shadow)">
    <rect class="card" width="240" height="330" rx="18"/>
    <text x="28" y="42" class="card-title">Large Broken</text>
    <text x="28" y="70" class="card-cn">大破</text>
    <text x="28" y="300" class="note">&lt;30% quota</text>
    <text x="28" y="320" class="tiny">Tired posture · visible damage</text>
    <g transform="translate(120 180) rotate(-8)">
      <path d="M-38 -75 L-66 -100 L-54 -58" class="hair"/>
      <path d="M38 -75 L66 -100 L54 -58" class="hair"/>
      <path d="M-54 -58 C-58 -25 -42 12 -24 28 L24 28 C42 12 58 -25 54 -58 C43 -96 -42 -96 -54 -58Z" class="hair"/>
      <circle class="skin" cx="0" cy="-48" r="42"/>
      <path d="M-20 -51 Q-14 -49 -8 -51" stroke="#7354b8" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M8 -51 Q14 -49 20 -51" stroke="#7354b8" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M-9 -32 Q0 -38 9 -32" stroke="#8b627a" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M-34 6 C-18 -8 18 -8 34 6 L46 76 C14 88 -21 91 -48 72Z" fill="url(#brokenDress)" stroke="#8794af" stroke-width="2"/>
      <path class="damage" d="M-31 28 l15 9 l-12 12 M18 24 l-12 11 l14 11 M-8 62 l11 7 l-13 9"/>
      <circle class="pendant" cx="0" cy="24" r="5.5"/>
      <path d="M-42 8 C-66 30 -55 53 -34 56" stroke="#8794af" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M42 8 C60 31 50 48 34 50" stroke="#8794af" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M42 -82 q16 -9 28 2" stroke="#9aa7c2" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <path class="arrow" d="M885 285 H910"/>
  <path d="M910 285 l-10 -7 v14Z" fill="#8da8d8"/>

  <g transform="translate(920 120)" filter="url(#shadow)">
    <rect class="card" width="240" height="330" rx="18"/>
    <text x="28" y="42" class="card-title">Depleted</text>
    <text x="28" y="70" class="card-cn">终了</text>
    <text x="28" y="300" class="note">&lt;10% quota</text>
    <text x="28" y="320" class="tiny">Collapsed · needs recovery</text>
    <ellipse cx="119" cy="258" rx="78" ry="10" fill="#aeb9ca" opacity="0.32"/>
    <g transform="translate(120 205) rotate(88)">
      <path d="M-38 -75 L-66 -100 L-54 -58" class="hair"/>
      <path d="M38 -75 L66 -100 L54 -58" class="hair"/>
      <path d="M-54 -58 C-58 -25 -42 12 -24 28 L24 28 C42 12 58 -25 54 -58 C43 -96 -42 -96 -54 -58Z" class="hair"/>
      <circle class="skin" cx="0" cy="-48" r="42"/>
      <path d="M-20 -51 H-8" stroke="#7354b8" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M8 -51 H20" stroke="#7354b8" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M-8 -31 Q0 -37 8 -31" stroke="#8b627a" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M-34 6 C-18 -8 18 -8 34 6 L44 74 C11 86 -20 88 -46 70Z" fill="url(#brokenDress)" stroke="#7b879f" stroke-width="2"/>
      <path class="damage" d="M-30 24 l14 10 l-13 10 M16 20 l-11 12 l15 13 M-10 58 l14 8 l-16 12"/>
      <circle class="pendant" cx="0" cy="24" r="5"/>
      <path d="M-42 8 C-61 28 -52 46 -35 50" stroke="#7b879f" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M42 8 C56 28 48 43 32 47" stroke="#7b879f" stroke-width="6" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
